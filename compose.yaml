name: planet-born

services:
  postgres:
    build:
      context: ./packages/database
    environment:
      POSTGRES_DB: planet
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: planet_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: planet
      MINIO_ROOT_PASSWORD: replace-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  ai-orchestrator:
    build:
      context: ./services/ai-orchestrator
    environment:
      APP_ENV: sandbox
      AI_PROVIDER: mock
    ports:
      - "8001:8001"

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
