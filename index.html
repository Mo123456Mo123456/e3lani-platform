<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanTrack Enterprise</title><style>body{margin:0;background:#f4f7f8;font-family:system-ui}.load{height:100vh;display:grid;place-items:center;color:#0e776f}.spin{width:42px;height:42px;border:4px solid #d8e8e6;border-top-color:#0e776f;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div><div class="spin"></div><p>جاري فتح CleanTrack…</p></div></div><script>(async()=>{try{let r=await fetch('https://mfoxbrwdyhnyyzvcnkyx.supabase.co/storage/v1/object/public/cleantrack-web/bundle.html?x=4',{cache:'no-store'});let h=await r.text();h=h.replace('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js').replace('<canvas id="qrCanvas"></canvas>','<div id="qrCanvas"></div>');h=h.replace(/function renderSticker\(\)\{.*?\}\nfunction selectQr/s,`function renderSticker(){let id=document.getElementById('qrBin')?.value||bins[0].id;document.getElementById('stickerBin').textContent=id;document.getElementById('stickerHint').textContent=document.getElementById('qrHint')?.value||'امسح الرمز بعد المرور على الحاوية';let box=document.getElementById('qrCanvas');if(box&&window.QRCode){box.innerHTML='';new QRCode(box,{text:'cleantrack://service/'+id+'?token=CT-'+btoa(id).replace(/=/g,'')+'-SIG',width:210,height:210,colorDark:'#102b31',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}}\nfunction selectQr`);document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><h2>تعذر فتح CleanTrack</h2><p>'+e.message+'</p></div></div>'}})()</script></body></html>
