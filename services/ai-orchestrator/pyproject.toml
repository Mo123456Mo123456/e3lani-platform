[project]
name = "living-planet-ai-orchestrator"
version = "0.1.0"
description = "Provider-neutral structured contribution analysis and grounded narration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pydantic>=2.11.0",
  "uvicorn[standard]>=0.35.0"
]

[project.optional-dependencies]
test = ["pytest>=8.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
