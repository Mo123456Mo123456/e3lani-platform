[project]
name = "planet-ai-orchestrator"
version = "0.1.0"
description = "Provider-neutral structured AI boundary for the living-world simulator"
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "fastapi",
  "google-genai",
  "httpx",
  "openai",
  "pydantic",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
