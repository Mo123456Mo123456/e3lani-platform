services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: planet
      POSTGRES_DB: planet_born
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet_born"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://planet:planet@postgres:5432/planet_born
      REDIS_URL: redis://redis:6379
      SIMULATION_URL: http://simulation:8001
      AI_ORCHESTRATOR_URL: http://ai:8002
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      simulation:
        condition: service_started
      ai:
        condition: service_started

  simulation:
    build:
      context: .
      dockerfile: services/simulation-engine/Dockerfile
    environment:
      DATABASE_URL: postgresql://planet:planet@postgres:5432/planet_born
      REDIS_URL: redis://redis:6379
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: services/ai-orchestrator/Dockerfile
    env_file: .env
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-sandbox}
      AI_SANDBOX_MODE: ${AI_SANDBOX_MODE:-true}
    ports:
      - "8002:8002"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  pgdata:
