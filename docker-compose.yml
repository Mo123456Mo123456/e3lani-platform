services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: planet
      POSTGRES_DB: planet_world
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet_world"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: planet
      MINIO_ROOT_PASSWORD: planetsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://planet:planet@postgres:5432/planet_world
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:4101
      SIMULATION_ENGINE_URL: http://simulation-engine:4102
      JWT_SECRET: change-me-in-production-use-long-secret
      NODE_ENV: production
      PORT: 4100
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  simulation-engine:
    build:
      context: .
      dockerfile: services/simulation-engine/Dockerfile
    environment:
      DATABASE_URL: postgresql://planet:planet@postgres:5432/planet_world
      REDIS_URL: redis://redis:6379
      PORT: 4102
    ports:
      - "4102:4102"
    depends_on:
      postgres:
        condition: service_healthy

  ai-orchestrator:
    build:
      context: .
      dockerfile: services/ai-orchestrator/Dockerfile
    environment:
      PORT: 4101
      AI_PROVIDER: mock
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "4101:4101"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4100
      NEXT_PUBLIC_WS_URL: ws://localhost:4100/ws
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4100
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
