services:
  postgres:
    build:
      context: .
      dockerfile: services/api/Dockerfile.postgres
    environment:
      POSTGRES_DB: planet
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planet}
    volumes:
      - planet_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet"]
      interval: 5s
      timeout: 4s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - planet_redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - planet_nats:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-planet}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-planet-storage-password}
    volumes:
      - planet_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://planet:${POSTGRES_PASSWORD:-planet}@postgres:5432/planet
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      WEB_ORIGIN: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:3001
      JWT_SECRET: ${JWT_SECRET:-development-only-change-this-secret-before-deploying}
      WORLD_SEED: ${WORLD_SEED:-kawkab-gaia-2026}
      AI_PROVIDER: ${AI_PROVIDER:-sandbox}
      ALLOW_SANDBOX_AI: ${ALLOW_SANDBOX_AI:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 4s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  admin:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"

volumes:
  planet_postgres:
  planet_redis:
  planet_nats:
  planet_minio:
