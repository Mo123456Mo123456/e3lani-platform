services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: planet_dev
      POSTGRES_DB: planet_born
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet_born"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-orchestrator:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai
    env_file: .env
    ports:
      - "5001:5001"

  simulation-engine:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.sim
    env_file: .env
    ports:
      - "4001:4001"

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  pgdata:
