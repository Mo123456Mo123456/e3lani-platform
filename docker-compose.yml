services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kawkab
      POSTGRES_USER: kawkab
      POSTGRES_PASSWORD: kawkab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kawkab -d kawkab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      API_PORT: 4000
      DATABASE_URL: postgres://kawkab:kawkab@postgres:5432/kawkab
      SQLITE_PATH: ./data/kawkab.sqlite
      JWT_SECRET: local-docker-secret
      SIMULATION_SEED: docker-seed
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  simulation:
    build:
      context: .
      dockerfile: services/simulation-engine/Dockerfile
    environment:
      SIMULATION_SEED: docker-seed
      SIMULATION_TICKS: 16
    depends_on:
      redis:
        condition: service_started

  realtime-gateway:
    build:
      context: .
      dockerfile: services/realtime-gateway/Dockerfile
    environment:
      REALTIME_PORT: 4010
    ports:
      - "4010:4010"
    depends_on:
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4010
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
      realtime-gateway:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
