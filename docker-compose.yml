services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: e3lani
      POSTGRES_PASSWORD: e3lani_local
      POSTGRES_DB: e3lani
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e3lani"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: e3lani
      MINIO_ROOT_PASSWORD: e3lani_minio_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 e3lani e3lani_minio_local; do sleep 1; done;
      mc mb --ignore-existing local/e3lani-media;
      mc anonymous set download local/e3lani-media;
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
