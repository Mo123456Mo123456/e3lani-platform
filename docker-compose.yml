services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: planet
      POSTGRES_DB: planet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/api/migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      SQLITE_PATH: /data/planet.db
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      API_PORT: 4000
      WEB_URL: http://localhost:3000
      SIM_ENGINE_URL: http://sim:8001
      AI_ORCHESTRATOR_URL: http://ai:8002
      REALTIME_URL: http://realtime:4001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal}
      DATABASE_URL: postgresql://planet:planet@postgres:5432/planet
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: planet
    ports:
      - "4000:4000"
    volumes:
      - planetdata:/data
    depends_on:
      - postgres
      - redis
      - realtime

  sim:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.sim
    environment:
      PORT: 8001
    ports:
      - "8001:8001"

  ai:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai
    environment:
      PORT: 8002
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8002:8002"

  realtime:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.realtime
    environment:
      REALTIME_PORT: 4001
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal}
    ports:
      - "4001:4001"

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:4001
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3001:3000"
    depends_on:
      - api

  notification-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.notification-worker
    environment:
      SQLITE_PATH: /data/planet.db
      API_URL: http://api:4000
      NOTIFICATION_POLL_MS: 5000
    volumes:
      - planetdata:/data
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  planetdata:
