# ─── Infrastructure ───────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: planet-postgres
    environment:
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: planet
      POSTGRES_DB: planet_born
    ports:
      - "5432:5432"
    volumes:
      - planet_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet_born"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: planet-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: planet-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: planetminio
      MINIO_ROOT_PASSWORD: planetminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - planet_minio:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgres://planet:planet@postgres:5432/planet_born
      JWT_SECRET: change-me-in-production-planet-born-secret
      AI_ORCHESTRATOR_URL: http://ai:4100
      REALTIME_URL: http://realtime:4300
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
      realtime:
        condition: service_started

  ai:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node-service
    environment:
      PORT: "4100"
      AI_PROVIDER: mock
      SERVICE_ENTRY: services/ai-orchestrator/dist/index.js
    command: ["node", "services/ai-orchestrator/dist/index.js"]
    ports:
      - "4100:4100"

  simulation:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node-service
    environment:
      PORT: "4200"
    command: ["node", "services/simulation-engine/dist/index.js"]
    ports:
      - "4200:4200"

  realtime:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node-service
    environment:
      PORT: "4300"
    command: ["node", "services/realtime-gateway/dist/index.js"]
    ports:
      - "4300:4300"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4300
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  planet_pg:
  planet_minio:
