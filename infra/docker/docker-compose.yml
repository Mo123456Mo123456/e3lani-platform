services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: planet_dev
      POSTGRES_DB: planet_born
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet_born"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://planet:planet_dev@postgres:5432/planet_born?schema=public
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      SIMULATION_URL: http://simulation:8001
      AI_ORCHESTRATOR_URL: http://ai:8002
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  simulation:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.simulation
    environment:
      DATABASE_URL: postgresql://planet:planet_dev@postgres:5432/planet_born
      REDIS_URL: redis://redis:6379
      PLANET_SEED: planet-born-alpha-2026
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ai
    environment:
      AI_PROVIDER: sandbox
      AI_SANDBOX_MODE: "true"
      DATABASE_URL: postgresql://planet:planet_dev@postgres:5432/planet_born
    ports:
      - "8002:8002"

  realtime:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.realtime
    environment:
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars!!
    ports:
      - "4001:4001"
    depends_on:
      - redis
      - nats

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:4001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
