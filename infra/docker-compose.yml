
# البنية التحتية المحلية لمنصة «إعلاني» — Local infrastructure for E3lani.
services:
  postgres:
    image: postgres:16-alpine
    container_name: e3lani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: e3lani
      POSTGRES_PASSWORD: e3lani
      POSTGRES_DB: e3lani
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e3lani -d e3lani"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: e3lani-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: e3lani-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: e3lani
      MINIO_ROOT_PASSWORD: e3lani-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # ينشئ الحاوية (bucket) تلقائيًا عند أول تشغيل
  minio-init:
    image: minio/mc:latest
    container_name: e3lani-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 e3lani e3lani-secret;
      mc mb --ignore-existing local/e3lani-media;
      mc anonymous set download local/e3lani-media;
      echo 'MinIO bucket e3lani-media is ready';
      exit 0;
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
