name: planet-ci

on:
  push:
    branches: ["**"]
    paths: ["planet/**", ".github/workflows/planet-ci.yml"]
  pull_request:
    paths: ["planet/**", ".github/workflows/planet-ci.yml"]

defaults:
  run:
    working-directory: planet

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: planet/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Generate Prisma client
        run: pnpm --filter @planet/api exec prisma generate

      - name: Build packages
        run: pnpm build:packages

      - name: Typecheck all
        run: pnpm -r run typecheck

      - name: Unit & integration tests
        run: pnpm -r run test

      - name: Build services & apps
        run: pnpm -r --filter './services/*' --filter './apps/*' build

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: planet
          POSTGRES_PASSWORD: planet
          POSTGRES_DB: planet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: planet/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://planet:planet@localhost:5432/planet
        run: pnpm --filter @planet/api exec prisma migrate deploy
      - name: Verify schema drift is zero
        env:
          DATABASE_URL: postgresql://planet:planet@localhost:5432/planet
        run: |
          cd services/api
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
