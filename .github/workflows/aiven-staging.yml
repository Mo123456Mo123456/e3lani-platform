name: Aiven Staging Database

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/global-free-launch-0f65
    paths:
      - .github/workflows/aiven-staging.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: e3lani-aiven-staging
  cancel-in-progress: false

jobs:
  initialize-and-verify:
    name: Initialize and verify Aiven MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VITE_APP_ID: e3lani-aiven-staging
      JWT_SECRET: aiven-staging-ci-only-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate protected database secret
        shell: bash
        run: |
          set -euo pipefail
          echo "secret-validation" > /tmp/aiven-stage
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL repository secret is missing."
            exit 1
          fi
          case "$DATABASE_URL" in
            mysql://*|mysql2://*) ;;
            *)
              echo "DATABASE_URL must be a MySQL connection URI."
              exit 1
              ;;
          esac
          if [[ "$DATABASE_URL" == *"127.0.0.1"* || "$DATABASE_URL" == *"localhost"* ]]; then
            echo "Refusing to initialize a local database from the Aiven workflow."
            exit 1
          fi
          echo "Protected MySQL secret is configured."

      - name: Apply current Drizzle schema to Aiven
        run: |
          echo "schema" > /tmp/aiven-stage
          pnpm exec drizzle-kit push --force

      - name: Seed central product data
        run: |
          echo "seed" > /tmp/aiven-stage
          pnpm db:seed

      - name: Verify commercial schema and launch defaults
        run: |
          echo "commercial-verification" > /tmp/aiven-stage
          node scripts/verify-commercial-schema.mjs

      - name: Verify OTP registration and reuse prevention
        run: |
          echo "otp-verification" > /tmp/aiven-stage
          pnpm exec tsx scripts/verify-otp-flow.ts

      - name: Verify cross-account ad publishing flow
        run: |
          echo "ad-flow-verification" > /tmp/aiven-stage
          pnpm exec tsx scripts/verify-server-ad-flow.ts

      - name: Publish protected staging result to PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          stage="$(cat /tmp/aiven-stage 2>/dev/null || echo setup)"
          if [ "$JOB_STATUS" = "success" ]; then
            body="✅ اكتمل ربط قاعدة Aiven MySQL بنجاح: تم تطبيق المخطط، تشغيل البذور، والتحقق من الإطلاق المجاني وOTP وتدفق الإعلان بين حسابين.\n\nتشغيل GitHub Actions: $RUN_URL"
          else
            body="❌ فشل تهيئة قاعدة Aiven MySQL عند مرحلة: \`$stage\`. لم يتم كشف أي قيمة سرية.\n\nتشغيل GitHub Actions: $RUN_URL"
          fi
          gh pr comment 11 --repo "$GITHUB_REPOSITORY" --body "$body"
