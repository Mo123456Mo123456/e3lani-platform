name: Apply critical safety patch

on:
  push:
    branches:
      - cursor/global-free-launch-0f65
    paths:
      - scripts/apply-critical-safety-patch.mjs

permissions:
  contents: write

concurrency:
  group: e3lani-critical-safety-patch
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NODE_ENV: test
      EXPO_NO_TELEMETRY: "1"
      VITE_APP_ID: e3lani-ci
      JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cursor/global-free-launch-0f65
          fetch-depth: 0

      - name: Apply exact critical fixes
        id: patch
        continue-on-error: true
        run: node scripts/apply-critical-safety-patch.mjs > critical-patch.log 2>&1

      - name: Commit patch diagnostics on failure
        if: steps.patch.outcome == 'failure'
        run: |
          mkdir -p docs
          cp critical-patch.log docs/critical-patch-failure.log
          git config user.name "E3lani Safety Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/critical-patch-failure.log
          git commit -m "chore: record critical patch failure"
          git push origin HEAD:cursor/global-free-launch-0f65
          exit 1

      - name: Install pnpm
        if: steps.patch.outcome == 'success'
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        if: steps.patch.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.patch.outcome == 'success'
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        if: steps.patch.outcome == 'success'
        run: pnpm check

      - name: Verify lint
        if: steps.patch.outcome == 'success'
        run: pnpm lint

      - name: Verify tests
        if: steps.patch.outcome == 'success'
        run: pnpm test

      - name: Verify server build
        if: steps.patch.outcome == 'success'
        run: pnpm build

      - name: Verify web export
        if: steps.patch.outcome == 'success'
        run: pnpm exec expo export --platform web --output-dir dist-web

      - name: Verify production Docker image
        if: steps.patch.outcome == 'success'
        run: docker build --tag e3lani-safety-check .

      - name: Remove one-time patch machinery
        if: steps.patch.outcome == 'success'
        run: rm -f scripts/apply-critical-safety-patch.mjs .github/workflows/apply-critical-safety-patch.yml critical-patch.log

      - name: Commit verified fixes
        if: steps.patch.outcome == 'success'
        run: |
          git config user.name "E3lani Safety Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden production launch safety"
          git push origin HEAD:cursor/global-free-launch-0f65
