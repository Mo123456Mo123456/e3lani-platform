name: MoneyPrinterTurbo Arabic Spike

on:
  push:
    branches:
      - mpt-spike-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Fetch MoneyPrinterTurbo v1.3.5
        run: |
          git clone --depth 1 --branch v1.3.5 https://github.com/harry0703/MoneyPrinterTurbo.git "$RUNNER_TEMP/MoneyPrinterTurbo"

      - name: Install MoneyPrinterTurbo dependencies
        working-directory: ${{ runner.temp }}/MoneyPrinterTurbo
        run: |
          uv sync --frozen --python 3.11
          cp config.example.toml config.toml

      - name: Create local portrait source material
        working-directory: ${{ runner.temp }}/MoneyPrinterTurbo
        run: |
          ffmpeg -y -f lavfi -i "testsrc2=size=720x1280:rate=30" -t 18 -c:v libx264 -pix_fmt yuv420p demo-source.mp4

      - name: Generate Arabic 9x16 video with MoneyPrinterTurbo
        working-directory: ${{ runner.temp }}/MoneyPrinterTurbo
        run: |
          uv run python cli.py \
            --video-script "الذكاء الاصطناعي لم يعد فكرة من المستقبل. اليوم يساعدنا على التعلم والعمل وصناعة المحتوى بسرعة أكبر. لكن القيمة الحقيقية ليست في الأداة وحدها، بل في الطريقة الذكية التي نستخدمها بها." \
            --video-language ar-SA \
            --video-source local \
            --video-materials "./demo-source.mp4" \
            --voice-name "ar-SA-HamedNeural" \
            --voice-rate 1.05 \
            --video-aspect "9:16" \
            --video-concat-mode sequential \
            --video-clip-duration 6 \
            --bgm-type none \
            --no-subtitle-enabled \
            --stop-at video | tee mpt-result.json

      - name: Collect generated MP4
        working-directory: ${{ runner.temp }}/MoneyPrinterTurbo
        run: |
          VIDEO_FILE=$(find storage/tasks -type f -name 'final-*.mp4' -print -quit)
          test -n "$VIDEO_FILE"
          test -s "$VIDEO_FILE"
          cp "$VIDEO_FILE" "$GITHUB_WORKSPACE/moneyprinterturbo-arabic-demo.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration -of default=noprint_wrappers=1 "$GITHUB_WORKSPACE/moneyprinterturbo-arabic-demo.mp4"

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-arabic-demo
          path: moneyprinterturbo-arabic-demo.mp4
          if-no-files-found: error
          retention-days: 7
