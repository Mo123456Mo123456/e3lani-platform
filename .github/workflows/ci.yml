name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planet
          POSTGRES_PASSWORD: planet_dev
          POSTGRES_DB: planet_born
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planet -d planet_born"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://planet:planet_dev@localhost:5432/planet_born
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      AI_PROVIDER: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @planet/shared-types build
      - run: pnpm --filter @planet/config build
      - run: pnpm --filter @planet/validation build
      - run: pnpm --filter @planet/simulation-models build
      - run: pnpm --filter @planet/simulation-models test
      - run: pnpm --filter @planet/ai-orchestrator test
      - run: pnpm --filter @planet/api db:migrate
