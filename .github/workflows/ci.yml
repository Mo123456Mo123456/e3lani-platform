name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://e3lani:e3lani@localhost:5432/e3lani?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-with-more-than-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-more-than-32-characters
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: e3lani
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret-key
      S3_PUBLIC_URL: http://localhost:9000/e3lani
      PAYMENT_PROVIDER: disabled
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      EXPO_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
