name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r services/simulation-engine/requirements.txt -r services/ai-orchestrator/requirements.txt
      - name: Simulation engine tests
        working-directory: services/simulation-engine
        run: ../../.venv/bin/python -m pytest
      - name: AI orchestrator tests
        working-directory: services/ai-orchestrator
        run: ../../.venv/bin/python -m pytest

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build
      - name: Typecheck all
        run: pnpm -r run typecheck
      - name: Unit tests
        run: pnpm -r run test
      - name: Build API
        run: pnpm --filter @planet/api run build
      - name: Build web
        run: pnpm --filter @planet/web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - name: Build admin
        run: pnpm --filter @planet/admin run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: planet
          POSTGRES_PASSWORD: planet
          POSTGRES_DB: planet_born
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planet -d planet_born"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install python deps + start services
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r services/simulation-engine/requirements.txt -r services/ai-orchestrator/requirements.txt
          psql -h localhost -U planet -d planet_born -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS vector;"
          cd services/simulation-engine && nohup ../../.venv/bin/uvicorn app.main:app --port 8001 &
          cd ../ai-orchestrator && nohup ../../.venv/bin/uvicorn app.main:app --port 8002 &
          sleep 4
        env:
          PGPASSWORD: planet
      - name: Install node deps
        run: pnpm install --frozen-lockfile=false
      - name: Build packages + api
        run: |
          pnpm -r --filter "./packages/*" run build
          pnpm --filter @planet/api run build
      - name: Migrate + seed (small world)
        working-directory: services/api
        run: pnpm run db:seed
        env:
          DATABASE_URL: postgres://planet:planet@localhost:5432/planet_born
          SIMULATION_ENGINE_URL: http://127.0.0.1:8001
          SEED_TICKS: 30
      - name: Boot API and run acceptance checks
        working-directory: services/api
        run: |
          export DATABASE_URL=postgres://planet:planet@localhost:5432/planet_born
          export SIMULATION_ENGINE_URL=http://127.0.0.1:8001
          export AI_ORCHESTRATOR_URL=http://127.0.0.1:8002
          export JWT_ACCESS_SECRET=ci-access-secret-0123456789abcdef
          export JWT_REFRESH_SECRET=ci-refresh-secret-0123456789abcdef
          export API_PORT=4100
          node dist/main.js &
          sleep 6
          bash scripts/acceptance.sh http://127.0.0.1:4100

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build api simulation-engine ai-orchestrator
