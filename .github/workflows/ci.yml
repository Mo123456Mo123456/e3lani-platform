name: E3lani CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "cursor/**"

permissions:
  contents: read

concurrency:
  group: e3lani-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, lint, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      EXPO_NO_TELEMETRY: "1"
      JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Build server
        run: pnpm build

      - name: Export Expo web
        run: pnpm exec expo export --platform web --output-dir dist-web
