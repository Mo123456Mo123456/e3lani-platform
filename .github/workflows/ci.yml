name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planet
          POSTGRES_PASSWORD: planet
          POSTGRES_DB: planet_world
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planet -d planet_world"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://planet:planet@localhost:5432/planet_world
      JWT_SECRET: ci-secret
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @planet/config --filter @planet/shared-types --filter @planet/validation --filter @planet/simulation-models --filter @planet/analytics --filter @planet/ui build
      - run: pnpm --filter @planet/simulation-models test
      - run: pnpm --filter @planet/validation test
      - run: pnpm --filter @planet/ai-orchestrator test
      - run: pnpm --filter @planet/api db:migrate
      - run: pnpm --filter @planet/api typecheck
      - run: pnpm --filter @planet/web typecheck
