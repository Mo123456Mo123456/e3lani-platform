name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Build packages
        run: |
          pnpm --filter @planet-born/shared-types build
          pnpm --filter @planet-born/config build
          pnpm --filter @planet-born/validation build
          pnpm --filter @planet-born/simulation-models build
          pnpm --filter @planet-born/analytics build
          pnpm --filter @planet-born/ui build
      - name: Test core
        run: |
          pnpm --filter @planet-born/simulation-models test
          pnpm --filter @planet-born/api test
          pnpm --filter @planet-born/ai-orchestrator test
      - name: Typecheck services
        run: |
          pnpm --filter @planet-born/api typecheck
          pnpm --filter @planet-born/ai-orchestrator typecheck
          pnpm --filter @planet-born/simulation-engine typecheck
          pnpm --filter @planet-born/realtime-gateway typecheck
      - name: Build apps
        run: |
          pnpm --filter @planet-born/web build
          pnpm --filter @planet-born/admin build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_WS_URL: ws://localhost:4300
