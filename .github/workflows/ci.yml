name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm -r run typecheck
      - name: Unit + integration tests (vitest)
        run: pnpm -r run test
      - name: Build web app
        run: pnpm --filter @planet/web build
      - name: Build admin app
        run: pnpm --filter @planet/admin build

  python-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-orchestrator/requirements.txt
      - name: pytest ai-orchestrator
        run: pytest services/ai-orchestrator
      - name: pytest simulation-engine
        run: pytest services/simulation-engine

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: |
          docker build -f services/api/Dockerfile .
          docker build -f services/ai-orchestrator/Dockerfile services/ai-orchestrator
          docker build -f services/simulation-engine/Dockerfile services/simulation-engine
          docker build -f apps/web/Dockerfile .
          docker build -f apps/admin/Dockerfile .
